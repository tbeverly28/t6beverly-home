<svg class="mesh" width="100%" height="100%" viewBox="0 0 300 150" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern class="stripe" id="diagonal-stripe" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <path stroke="dimgray" stroke-width="3px" d="M0 0v20"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#diagonal-stripe)"/>
</svg>

